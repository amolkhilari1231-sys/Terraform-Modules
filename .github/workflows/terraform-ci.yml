name: Enterprise Terraform CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  terraform-ci:
    name: Terraform Validation & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Production

    steps:
      ########################################################
      # Checkout Repository
      ########################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # Setup Terraform
      ########################################################
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      ########################################################
      # Terraform Format Check
      ########################################################
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      ########################################################
      # Terraform Init
      ########################################################
      - name: Terraform Init
        run: terraform init -backend=false

      ########################################################
      # Terraform Validate
      ########################################################
      - name: Terraform Validate
        run: terraform validate

      ########################################################
      # Setup TFLint
      ########################################################
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      ########################################################
      # Initialize TFLint
      ########################################################
      - name: Initialize TFLint
        run: tflint --init --config=../.tflint.hcl

      ########################################################
      # Run TFLint
      ########################################################
      - name: Run TFLint
        run: tflint --recursive --config=../.tflint.hcl

      ########################################################
      # Run tfsec
      # ########################################################
      # - name: Run tfsec
      #   uses: aquasecurity/tfsec-action@v1.0.3
      #   with:
      #     working_directory: Production

      # ########################################################
      # # Run Gitleaks
      # ########################################################
      # - name: Run Gitleaks
      #   uses: step-security/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ########################################################
      # Pipeline Success
      ########################################################
      - name: Success
        if: success()
        run: echo "Terraform CI Pipeline Completed Successfully."